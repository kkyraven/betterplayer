[package]
name = "bp-devices"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serialport = "4"
tungstenite = "0.30"
serde_json = "1"
# win-system-proxy: the proxy Windows is configured with, so the Handy's servers are reachable
# from behind one; nothing else honours HTTP_PROXY there.
ureq = { version = "3", features = ["win-system-proxy"] }
sha2 = "0.10"
base64 = "0.23"
bp-script.workspace = true
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = "1"
# The embedded Buttplug server (Bluetooth toys without Intiface Central). Bluetooth only; the
# client, server and core crates run on the tokio runtime `toys.rs` owns.
buttplug_core = { version = "11", default-features = false, features = ["tokio-runtime"] }
buttplug_client = { version = "11", default-features = false, features = ["tokio-runtime"] }
buttplug_client_in_process = { version = "11", default-features = false, features = ["tokio-runtime", "btleplug-manager"] }
buttplug_server = { version = "11", default-features = false, features = ["tokio-runtime"] }
buttplug_server_hwmgr_btleplug = "11"
buttplug_server_device_config = "11"

# macOS: the mach thread policy for the tick thread (realtime.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows: timer resolution and thread priority for the tick thread (realtime.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading"] }
