[package]
name = "bp-player"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gl = "0.14"
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"

# Windows: DXGI for the GPU probe and the addon path, libloading for ANGLE and NvOFFRUC.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }
libloading = "0.9"
