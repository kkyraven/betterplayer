[package]
name = "bp-detect"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# ONNX Runtime with its prebuilt binaries fetched at build time. The same pinned release and
# decode path as deepdrop's drop-infer, so a model that works there works here.
[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "std"] }

# The prebuilt macOS binary already contains the CoreML provider; the feature only turns on
# its registration hook. Same for DirectML in the Windows binary.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "std", "coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "std", "directml"] }
