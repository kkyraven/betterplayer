[package]
name = "bp-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# ONNX Runtime the way bp-detect takes it: the same pinned release and prebuilt binaries, so a
# graph that runs there runs here. CoreML on macOS, CPU everywhere.
[dependencies]
bp-script.workspace = true
bp-tracking.workspace = true
bp-beat.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "std", "coreml"] }
