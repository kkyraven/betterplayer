[package]
name = "bp-devices"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serialport = "4"
tungstenite = { version = "0.30", features = ["native-tls"] }
serde_json = "1"
ureq = { version = "3", features = ["win-system-proxy"] }
sha2 = "0.10"
base64 = "0.23"
bp-script.workspace = true
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = "1"
buttplug_core = { version = "11", default-features = false, features = ["tokio-runtime"] }
buttplug_client = { version = "11", default-features = false, features = ["tokio-runtime"] }
buttplug_client_in_process = { version = "11", default-features = false, features = ["tokio-runtime", "btleplug-manager"] }
buttplug_server = { version = "11", default-features = false, features = ["tokio-runtime"] }
buttplug_server_hwmgr_btleplug = "11"
buttplug_server_device_config = "11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading"] }
