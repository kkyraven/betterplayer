name: Publish release

on:
  repository_dispatch:
    types: [publish-release]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download published installers
        env:
          ASSETS_JSON: ${{ toJson(github.event.client_payload.assets) }}
        run: |
          mkdir assets
          jq -r '.[]' <<< "$ASSETS_JSON" | while read -r url; do
            curl --fail --location --retry 3 --retry-delay 2 --output "assets/${url##*/}" "$url"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --generate-notes
          fi
